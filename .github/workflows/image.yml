name: Build and Push Image

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: make development-requirements

      - name: Lint with Ruff
        run: make lint

      - name: Run pre-commit workflow
        run: make pre-commit-install pre-commit-run

  build:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v5

      # The containerd store preserves both platforms through load/save/push.
      - name: Setup Docker image store
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=,suffix=
            type=sha,format=long,prefix=,suffix=
            type=ref,event=branch,prefix=,suffix=

      - name: Display metadata
        env:
          BAKE_FILE: ${{ steps.meta.outputs.bake-file }}
        run: cat "$BAKE_FILE"

      - name: Build and load image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          load: true
          push: false
          cache-from: type=gha,scope=jupyter-image
          cache-to: type=gha,scope=jupyter-image,mode=max
          tags: |
            jupyter:test
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Save image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<< "$IMAGE_TAGS"
          docker image save --output "$RUNNER_TEMP/jupyter-image.tar" jupyter:test "${tags[@]}"

      - name: Archive image
        uses: actions/upload-artifact@v4
        with:
          name: built-image
          path: ${{ runner.temp }}/jupyter-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Archive metadata
        uses: actions/upload-artifact@v4
        with:
          name: metadata.json
          path: ${{ steps.meta.outputs.bake-file }}

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: make development-requirements

      - name: Setup Docker image store
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: built-image
          path: ${{ runner.temp }}

      - name: Load image
        run: docker image load --input "$RUNNER_TEMP/jupyter-image.tar"

      - name: Test both platforms with unittest
        run: |
          for platform in linux/amd64 linux/arm64; do
            echo "Testing $platform"
            DOCKER_DEFAULT_PLATFORM="$platform" make test-image
          done

  push:
    needs: [build, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Setup Docker image store
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {"features": {"containerd-snapshotter": true}}

      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: built-image
          path: ${{ runner.temp }}

      - name: Load tested image
        run: docker image load --input "$RUNNER_TEMP/jupyter-image.tar"

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image
        env:
          IMAGE_TAGS: ${{ needs.build.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker image push "$tag"
          done <<< "$IMAGE_TAGS"
